<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全球商務腦 Brain for Cross-border Deal</title>
<style>
:root{
  --bg:#f4f6fb;--panel:#ffffff;--ink:#172033;--sub:#5d6880;--line:#dfe4ee;
  --brand:#1f5fd1;--brand2:#0f3f99;--soft:#e8f0ff;--ok:#1f8a4c;--warn:#b86e00;--bad:#c62828;
  --up:#1f8a4c;--down:#c62828;--flat:#7a8499;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1420;--panel:#171e2d;--ink:#e6ebf5;--sub:#9aa6bf;--line:#2a3448;
  --brand:#5b8ff0;--brand2:#9bbcff;--soft:#1d2a45;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.demo{background:#fff4d6;color:#6b4a00;text-align:center;font-size:12px;padding:4px 8px}
@media (prefers-color-scheme: dark){.demo{background:#3a2e10;color:#f3d48a}}
/* login */
#login{display:flex;align-items:center;justify-content:center;min-height:calc(100% - 26px);padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.login-card{width:100%;max-width:400px;text-align:center}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#36b3a8);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 14px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.block{display:block;width:100%;margin:8px 0}
.btn.sm{padding:5px 10px;font-size:13px}
/* app */
#app{display:none;min-height:calc(100% - 26px)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 26px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
nav .brand .logo{width:34px;height:34px;font-size:16px;border-radius:10px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:9px}
nav button.on{background:var(--soft);color:var(--brand);font-weight:bold}
nav .meta{margin-top:auto;font-size:12px;color:var(--sub);padding:8px}
main{padding:20px 24px;overflow:auto}
h1{font-size:20px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile h3{margin:0 0 6px;font-size:15px}
.muted{color:var(--sub);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--line);color:var(--sub)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.brand{color:var(--brand);border-color:var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:normal;font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 140px);background:var(--panel);border:1px solid var(--line);border-radius:12px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:78%;padding:10px 13px;border-radius:12px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.m .src{display:block;margin-top:6px;font-size:11.5px;opacity:.75}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--sub)}
.ch-ico{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:13px}
svg text{fill:var(--sub);font-size:11px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{border:0;background:var(--panel);color:var(--ink);padding:5px 10px}
.toggle button.on{background:var(--brand);color:#fff}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav .brand,nav .meta{display:none}
  nav button{white-space:nowrap}
  .g2,.g3,.g4{grid-template-columns:1fr}
  main{padding:14px 16px}
  .m{max-width:92%}
}
</style>
</head>
<body>

    <button class="btn block" onclick="enter()">用 Microsoft 帳號登入</button>

<section id="app">

  <main id="view"></main>
</div>
</section>

const COUNTRIES = [
  {c:"日本",f:"🇯🇵",idx:78,tr:"up",d:"+18%",imp:"穩定成長",ch:"Email → LINE",buyers:42,lag:"週"},
  {c:"德國",f:"🇩🇪",idx:74,tr:"up",d:"+11%",imp:"成長",ch:"Email → LinkedIn",buyers:57,lag:"週"},
  {c:"越南",f:"🇻🇳",idx:69,tr:"up",d:"+24%",imp:"快速成長",ch:"Email → Zalo",buyers:23,lag:"月"},

const SERIES = { // 12 個月需求熱度（示意）

V.connect = ()=>`
<h1>連接管道</h1><p class="lead">Email 是主軸；通訊工具依你要打的國家接上。商務腦會說明每個工具能做和不能做的事。</p>
<div class="grid g3">${CHANNELS.map(c=>`

</div>

V.knowledge = ()=>`
<h1>公司知識庫</h1><p class="lead">把公司和產品的所有資料丟進來，商務腦會整理成產品檔案，寫信和回答問題都以這裡為準。</p>
<div class="grid g2">
 <div class="tile"><div class="drop">把網站網址、粉專網址、簡報、型錄、影片、圖片拖到這裡<br><br><button class="btn primary sm" onclick="alert('示意介面：不會真的上傳')">選擇檔案</button> <button class="btn sm" onclick="alert('示意介面')">貼上網址</button></div>

V.brain = ()=>`
<h1>問商務腦</h1><p class="lead">問你想打的國家、產品或買家。數字一律附出處；查不到就直接說查不到。</p>
<div class="chat"><div class="msgs" id="msgs">
 <div class="m b">你好！我已經讀完你的官網、型錄和工廠影片，產品歸在 HS ${PROFILE.hs}。
你想打哪一個國家？也可以問「哪 3 個國家最值得打」。</div>
</div>
<div class="chips">${["我要打日本","哪 3 個國家最值得打","越南的需求怎麼樣？","幫我寫日本的第一封信"].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join("")}</div>
<div class="composer"><input id="q" placeholder="例如：德國對電輔車零件的需求在上升嗎？" onkeydown="if(event.key==='Enter')ask(this.value)"><button class="btn primary" onclick="ask($('#q').value)">送出</button></div></div>`;
function reply(q){
  const c = COUNTRIES.find(x=>q.includes(x.c));
  if(q.includes("3 個")) return {t:`依需求熱度和你的產品條件，建議先打：
1. 日本 ${COUNTRIES[0].f}  熱度 78，近 3 個月詢價和回覆明顯上升（${COUNTRIES[0].d}）
2. 德國 ${COUNTRIES[1].f}  熱度 74，進口持續成長，買家多
3. 越南 ${COUNTRIES[2].f}  熱度 69，成長最快（${COUNTRIES[2].d}），電動機車組裝廠增加
要看哪一國的細節？`,s:"出處：需求趨勢（1,284 家使用者匿名彙總）＋ UN Comtrade HS 8536.69（示意）"};
  if(q.includes("寫")) return {t:`件名：【IP67 防水コネクタ】e-Bike 向け｜サンプル提供のご案内

示意 A 電動自行車株式會社　ご担当者様

突然のご連絡失礼いたします。台湾の示意公司で営業を担当しております……
（依日本商務禮儀：敬語、公司介紹 2 行、具體賣點 3 點、附日文型錄、提出樣品）

要寄給名單裡 18 家有採購窗口 Email 的公司嗎？寄出前會先給你核准。`,s:"管道建議：日本第一封用 Email；回覆後改 LINE 約會議"};
  if(c){ state.country=c.c; return {t:`${c.f} ${c.c}：需求熱度 ${c.idx}／100，${c.tr==="up"?"上升":c.tr==="down"?"下降":"持平"}（近 3 個月 ${c.d}）。
・公開進口數據：${c.imp}（資料落後約 3 個月）
・使用者匿名訊號：詢價與回覆${c.tr==="up"?"增加":"沒有明顯變化"}，更新頻率：${c.lag}
・名單庫找到 ${c.buyers} 家可能的買家
・建議管道：${c.ch}

我不會顯示其他使用者的客戶或報價，只提供匯總後的趨勢。要看趨勢圖或買家名單嗎？`,s:`出處：需求趨勢（匿名彙總，門檻：至少 5 家使用者公司、20 個買家）＋ ${c.c}海關進口統計（示意）`}; }
  return {t:"我先以你的產品（HS "+PROFILE.hs+"）來看。可以告訴我想打的國家嗎？例如日本、德國、越南、美國、印度。",s:""};
}
function ask(q){ q=(q||"").trim(); if(!q) return; const box=$("#msgs");
  box.insertAdjacentHTML("beforeend",`<div class="m u"></div>`); box.lastElementChild.textContent=q;
  const r=reply(q); setTimeout(()=>{ box.insertAdjacentHTML("beforeend",`<div class="m b"></div>`); const el=box.lastElementChild; el.textContent=r.t; if(r.s){const s=document.createElement("span");s.className="src";s.textContent=r.s;el.appendChild(s);} box.scrollTop=box.scrollHeight; },350);
  const qi=$("#q"); if(qi) qi.value=""; box.scrollTop=box.scrollHeight; }

V.trends_after = ()=>{ const d=SERIES[state.country]; const W=460,H=200,P=28; const mx=100,mn=30;
  const x=i=>P+i*(W-P*2)/(d.length-1), y=v=>H-P-(v-mn)*(H-P*2)/(mx-mn);
  const pts=d.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const months=["12月","1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月"];
  $("#chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${state.country}需求熱度趨勢">
  ${[40,60,80,100].map(g=>`<line x1="${P}" x2="${W-P}" y1="${y(g)}" y2="${y(g)}" stroke="currentColor" opacity=".12"/><text x="4" y="${y(g)+4}">${g}</text>`).join("")}
  <polyline points="${pts}" fill="none" stroke="#1f5fd1" stroke-width="2.5"/>
  ${d.map((v,i)=>i%3===2||i===d.length-1?`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#1f5fd1"/><text x="${x(i)-10}" y="${H-8}">${months[i]}</text>`:"").join("")}
  <text x="${x(d.length-1)-14}" y="${y(d[d.length-1])-8}" style="fill:#1f5fd1;font-weight:bold">${d[d.length-1]}</text></svg>`; };
